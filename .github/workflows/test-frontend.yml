name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: 🐟 Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: 🐟 Check out repository
        uses: actions/checkout@v5

      - name: 🐟 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 🐟 Install frontend dependencies
        run: npm --prefix frontend ci --loglevel=error

      - name: 🐟 Test frontend
        run: make test-js
